    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <style>
      .pregunta { font-size: 1.5rem; margin-bottom: 20px; }
      .opciones img { width: 100%; height: 100%; }
      .opcion { margin-bottom: 15px; transition: all 0.3s ease-in-out; }
      .btn-correcta { background-color: #28a745 !important; color: white; box-shadow: 0 0 15px rgba(40, 167, 69, 0.8); transition: all 0.5s ease; }
      .btn-incorrecta { background-color: #dc3545 !important; color: white; box-shadow: 0 0 15px rgba(220, 53, 69, 0.8); transition: all 0.5s ease; }
      .btn-siguiente { background-color: #007bff; transition: background-color 0.3s ease; }
      .btn-siguiente:hover { background-color: #0056b3; }
      .opcion button:disabled { cursor: not-allowed; }

      /* Modal Animations */
      @keyframes slideIn {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .modal-content {
        animation: slideIn 0.5s ease-out;
      }

      /* Center modal */
      .modal-dialog-centered {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Adding fade effect for closing */
      .modal.fade .modal-dialog {
        transform: scale(0.7);
        opacity: 0;
        animation: fadeInOut 5s forwards;
      }

      @keyframes fadeInOut {
        0% { transform: scale(0.7); opacity: 0; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
      }

      /* Correct Answer Animation */
      .modal-content.correcto {
        background-color: #28a745;
        color: white;
        animation: correctAnimation 1s ease-out;
      }

      /* Incorrect Answer Animation */
      .modal-content.incorrecto {
        background-color: #dc3545;
        color: white;
        animation: incorrectAnimation 1s ease-out;
      }

      @keyframes correctAnimation {
        0% { background-color: #28a745; transform: scale(0.9); opacity: 0; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes incorrectAnimation {
        0% { background-color: #dc3545; transform: scale(0.9); opacity: 0; }
        50% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

    </style>
</head>
<body>

    <div id="cuestionario" class="container py-4 text-center">
        <div id="pregunta" class="pregunta"></div>
        <p>Escucha atentamente y selecciona la respuesta correcta</p>
        <audio id="audio" controls></audio>
        <div id="opciones" class="row row-cols-2 row-cols-md-4 g-3 justify-content-center"></div>
        <button id="siguiente" class="btn btn-siguiente mt-4">Siguiente</button>
        <div id="resultado" class="text-center"></div>
        <button id="VolverJ" class="btn btn-primary mt-4" onclick="window.location.href = '/PAGE/CUERPO-HUMANO/preguntas_cuerpo.html'">Volver A Jugar</button>
    </div>

    <!-- Modal para respuestas correctas e incorrectas -->
    <div class="modal fade" id="respuestaModal" tabindex="-1" aria-labelledby="respuestaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="respuestaModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="mensajeModal">
                    <!-- El mensaje dinámico de la respuesta será insertado aquí -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="mostrarPregunta()">Siguiente</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const preguntas = [
            {
                pregunta: "¿Quién es?",
                imagenes: ["../../IMG/FAMILIA/ABUELO.png", "../../IMG/FAMILIA/ABUELA.png", "../../IMG/FAMILIA/HERMANA.png", "../../IMG/FAMILIA/MAMA.png"],
                audio: "../../AUDIO/FAMILIA/ABUELA.mp3",
                correcta: 1
            },
            {
                pregunta: "¿Qué parte del cuerpo es?",
                imagenes: ["../../IMG/FAMILIA/ABUELO.png", "../../IMG/FAMILIA/BEBE.png", "../../IMG/FAMILIA/MAMA.png", "../../IMG/FAMILIA/PAPA.png"],
                audio: "../../AUDIO/FAMILIA/ABUELO.mp3",
                correcta: 0
            },
            {
                pregunta: "¿Qué parte del cuerpo es?",
                imagenes: ["../../IMG/FAMILIA/PAPA.png", "../../IMG/FAMILIA/HERMANO.png", "../../IMG/FAMILIA/HERMANA.png", "../../IMG/FAMILIA/BEBE.png"],
                audio: "../../AUDIO/FAMILIA/BEBE.mp3",
                correcta: 3
            },
            {
                pregunta: "¿Qué parte del cuerpo es?",
                imagenes: ["../../IMG/FAMILIA/HERMANO.png", "../../IMG/FAMILIA/HERMANA.png", "../../IMG/FAMILIA/BEBE.png", "../../IMG/FAMILIA/MAMA.png"],
                audio: "../../AUDIO/FAMILIA/HERMANA.mp3",
                correcta: 1
            },
            {
                pregunta: "¿Qué parte del cuerpo es?",
                imagenes: ["../../IMG/FAMILIA/ABUELA.png", "../../IMG/FAMILIA/HERMANO.png", "../../IMG/FAMILIA/PAPA.png", "../../IMG/FAMILIA/ABUELO.png"],
                audio: "../../AUDIO/FAMILIA/HERMANO.mp3",
                correcta: 3
            },
            {
                pregunta: "¿Qué parte del cuerpo es?",
                imagenes: ["../../IMG/FAMILIA/MAMA.png", "../../IMG/FAMILIA/BEBE.png", "../../IMG/FAMILIA/HERMANA.png", "../../IMG/FAMILIA/PAPA.png"],
                audio: "../../AUDIO/FAMILIA/MAMA.mp3",
                correcta: 0
            },
            {
                pregunta: "¿Qué parte del cuerpo es?",
                imagenes: ["../../IMG/FAMILIA/ABUELA.png", "../../IMG/FAMILIA/PAPA.png", "../../IMG/FAMILIA/HERMANO.png", "../../IMG/FAMILIA/MAMA.png"],
                audio: "../../AUDIO/FAMILIA/PAPA.mp3",
                correcta: 1
            }
        ];

        let preguntaActual = 0;
        let correctas = 0;
        let incorrectas = 0;
        document.getElementById('VolverJ').classList.add('d-none');

        function mostrarPregunta() {
            const pregunta = preguntas[preguntaActual];
            document.getElementById('pregunta').textContent = pregunta.pregunta;

            const opcionesDiv = document.getElementById('opciones');
            opcionesDiv.innerHTML = '';

            pregunta.imagenes.forEach((imagen, index) => {
                const col = document.createElement('div');
                col.className = 'col opcion';
                col.innerHTML = `<button class="btn btn-outline-secondary w-100" onclick="verificarRespuesta(${index})">
                                    <img src="${imagen}" alt="Opción ${index + 1}" class="img-fluid rounded">
                                </button>`;
                opcionesDiv.appendChild(col);
            });

            document.getElementById('audio').src = pregunta.audio;
            document.getElementById('audio').play();
        }

        function verificarRespuesta(index) {
            const pregunta = preguntas[preguntaActual];
            const opcionesDiv = document.getElementById('opciones');
            const opciones = opcionesDiv.querySelectorAll('.opcion');

            const modal = new bootstrap.Modal(document.getElementById('respuestaModal'));
            const modalTitle = document.getElementById('respuestaModalLabel');
            const modalBody = document.getElementById('mensajeModal');

            // Agregar animación y mensaje según respuesta correcta/incorrecta
            if (index === pregunta.correcta) {
                correctas++;
                modalTitle.textContent = "¡Respuesta Correcta!";
                modalBody.innerHTML = "<p>¡Bien hecho! Has seleccionado la respuesta correcta.</p>";
                document.querySelector('.modal-content').classList.add('correcto'); // Agregar clase de animación verde
            } else {
                incorrectas++;
                modalTitle.textContent = "¡Te has equivocado!";
                modalBody.innerHTML = "<p>Inténtalo de nuevo. La respuesta correcta es diferente.</p>";
                document.querySelector('.modal-content').classList.add('incorrecto'); // Agregar clase de animación roja
            }

            opciones.forEach(opcion => {
                opcion.querySelector('button').disabled = true;
            });

            modal.show();

            preguntaActual++;
            if (preguntaActual < preguntas.length) {
                setTimeout(() => {
                    modal.hide();
                    document.querySelector('.modal-content').classList.remove('correcto', 'incorrecto'); // Limpiar clases
                    mostrarPregunta();
                }, 4000);
            } else {
                setTimeout(() => {
                    document.getElementById('resultado').textContent = `Resultados: ${correctas} correctas, ${incorrectas} incorrectas.`;
                    document.getElementById('siguiente').classList.add('d-none');
                    document.getElementById('VolverJ').classList.remove('d-none');
                }, 4000);
            }
        }

        document.getElementById('siguiente').onclick = mostrarPregunta;
        mostrarPregunta();
    </script>
</body>
